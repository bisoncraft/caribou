version: "2"
run:
  timeout: 10m
linters:
  default: none
  enable:
    - asciicheck
    - bidichk
    - durationcheck
    - govet
    - grouper
    - ineffassign
    - makezero
    - nosprintfhostport
    - reassign
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - tparallel
    - unconvert
  settings:
    staticcheck:
      checks:
          - S1*
  exclusions:
    paths:
      - docs/examples
      # Vendored npm dependencies (untracked, pulled in by the SPA build) that
      # happen to ship Go sources - not our code to lint.
      - node_modules
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - docs/examples
      - node_modules
