name: Build and Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build-go:
    name: Go CI
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.25', '1.26']
    steps:
      - uses: awalsh128/cache-apt-pkgs-action@acb598e5ddbc6f68a970c5da0688d2f3a9f04d05 #v1.6.0
        with:
          packages: libgtk-3-dev libwebkit2gtk-4.1-dev
          version: 1.0

      - name: Check out source
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 #v6.0.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c #v6.1.0
        with:
          go-version: ${{ matrix.go }}
          cache: true

      # We used to run `git restore-mtime` here as a Go test-cache
      # optimization, but `git-restore-mtime` invokes the deprecated
      # `git whatchanged` (refuses to run as of git 2.54 without
      # --i-still-use-this), which broke every CI run. Tests are
      # correct without it; CI is just slower on cache misses.
      - name: Install Linters
        # Skip on 1.26: the pinned linter is skipped there via SKIP_GO_LINT, so
        # installing it just wastes CI time. Bump when the matrix changes.
        if: matrix.go != '1.26'
        run: "curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.6.2"

      - name: Test
        # RUN_TIDY_CHECK gates the `go mod tidy` no-op check in run_tests.sh;
        # set it on the highest Go version so the gate runs exactly once per CI
        # run. SKIP_GO_LINT skips golangci-lint on 1.26: the pinned linter is
        # built with go1.25 and panics on go1.26 std-lib files, so lint runs on
        # the 1.25 job instead. Bump the versions below when the matrix changes.
        env:
          RUN_TIDY_CHECK: ${{ matrix.go == '1.26' && '1' || '' }}
          SKIP_GO_LINT: ${{ matrix.go == '1.26' && '1' || '' }}
        run: |
          mkdir -p wallet/appserver/newui/dist
          touch -t 2306151245 wallet/appserver/newui/dist/placeholder
          ./run_tests.sh
  build-js:
    name: Build JS
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
    - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 #v6.0.0
    - name: Use nodejs ${{ matrix.node-version }}
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 #v5.0.0
      with:
        node-version: ${{ matrix.node-version }}
    # The UI is an npm workspace (shared + newui + mobile) with a single
    # lockfile at wallet/appserver. Install/lint/build from the workspace root
    # so the pinned toolchain (incl. TypeScript) is used and every workspace is
    # covered, not just newui.
    - name: npm clean-install
      working-directory: ./wallet/appserver
      run: npm ci
    - name: npm run lint
      working-directory: ./wallet/appserver
      run: npm run lint
    - name: npm run build
      working-directory: ./wallet/appserver
      run: npm run build
    - name: npm run test
      working-directory: ./wallet/appserver
      run: npm run test

  lint-docs:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 #v6.0.0
    - uses: DavidAnson/markdownlint-cli2-action@30a0e04f1870d58f8d717450cc6134995f993c63 #v21.0.0
      with:
        globs: |
          *.md
          docs/**/*.md
