name: Build and Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build-go:
    name: Go CI
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.25', '1.26']
    steps:
      - uses: awalsh128/cache-apt-pkgs-action@acb598e5ddbc6f68a970c5da0688d2f3a9f04d05 #v1.6.0
        with:
          packages: libgtk-3-dev libwebkit2gtk-4.1-dev
          version: 1.0

      - name: Check out source
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 #v6.0.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c #v6.1.0
        with:
          go-version: ${{ matrix.go }}
          # Caching is handled by the explicit cache steps below.
          cache: false

      # The Go caches are managed explicitly instead of with setup-go's
      # `cache: true`: setup-go keys one snapshot of both caches on a hash
      # of go.sum and saves only on a key miss, so its snapshot is frozen
      # at the first run after each go.sum change and the Go test cache
      # inside it goes stale as master advances.
      #
      # The module cache only changes when go.sum does, so a go.sum-keyed
      # snapshot is the right shape for it and it stays out of the
      # per-commit snapshots below. The key is shared across matrix legs
      # (module downloads are Go-version-independent); on the first run
      # after a go.sum change the legs race to save it and the loser logs
      # a benign "unable to reserve cache" warning.
      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-mod-${{ runner.os }}-

      # The build cache is where staleness hurts: restoring per-commit with
      # a prefix fallback keeps every run on the freshest snapshot, so
      # tests of unchanged packages hit the test cache ("ok <pkg> (cached)")
      # instead of re-running. Saves are limited to master pushes (see the
      # post-Test step) and cover only the build cache, so master pushes
      # don't churn the repo's 10 GB Actions cache pool with redundant
      # copies of the module cache.
      #
      # (`git restore-mtime` used to run post-checkout for "test cache"
      # reasons; the Go test cache hashes file contents, not mtimes, so it
      # was never needed.)
      - name: Restore Go build cache
        id: go-build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-go${{ matrix.go }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-go${{ matrix.go }}-

      - name: Install Linters
        # Skip on 1.26: the pinned linter is skipped there via SKIP_GO_LINT, so
        # installing it just wastes CI time. Bump when the matrix changes.
        if: matrix.go != '1.26'
        run: "curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.6.2"

      - name: Test
        # RUN_TIDY_CHECK gates the `go mod tidy` no-op check in run_tests.sh;
        # set it on the highest Go version so the gate runs exactly once per CI
        # run. SKIP_GO_LINT skips golangci-lint on 1.26: the pinned linter is
        # built with go1.25 and panics on go1.26 std-lib files, so lint runs on
        # the 1.25 job instead. Bump the versions below when the matrix changes.
        env:
          RUN_TIDY_CHECK: ${{ matrix.go == '1.26' && '1' || '' }}
          SKIP_GO_LINT: ${{ matrix.go == '1.26' && '1' || '' }}
        run: |
          mkdir -p wallet/appserver/desktop/dist
          touch -t 2306151245 wallet/appserver/desktop/dist/placeholder
          ./run_tests.sh

      # Master-only so the cache pool holds a small number of fresh
      # master snapshots; PR runs restore them via the prefix fallback
      # above but never save their own. Runs even when Test fails —
      # compiled packages and passing-package test results from a red run
      # are still valid and keep later runs warm. The cache-hit guard
      # skips the save on workflow re-runs, where the per-commit key
      # already exists and saving would only log a warning.
      - name: Save Go build cache
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.go-build-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-go${{ matrix.go }}-${{ github.sha }}
  build-js:
    name: Build JS
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
    - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 #v6.0.0
    - name: Use nodejs ${{ matrix.node-version }}
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 #v5.0.0
      with:
        node-version: ${{ matrix.node-version }}
    # The UI is an npm workspace (shared + desktop + mobile) with a single
    # lockfile at wallet/appserver. Install/lint/build from the workspace root
    # so the pinned toolchain (incl. TypeScript) is used and every workspace is
    # covered, not just desktop.
    - name: npm clean-install
      working-directory: ./wallet/appserver
      run: npm ci
    - name: npm run lint
      working-directory: ./wallet/appserver
      run: npm run lint
    - name: npm run build
      working-directory: ./wallet/appserver
      run: npm run build
    - name: npm run test
      working-directory: ./wallet/appserver
      run: npm run test

  lint-docs:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 #v6.0.0
    - uses: DavidAnson/markdownlint-cli2-action@30a0e04f1870d58f8d717450cc6134995f993c63 #v21.0.0
      with:
        globs: |
          *.md
          docs/**/*.md
