name: Android build
on:
  workflow_dispatch:

# Builds an unsigned simnet debug APK of the Android app (wallet/android)
# without Monero, as a check that the shell, the Go binding and the Gradle
# build still fit together. Release builds are made by
# release/package-android.sh, not here.
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 #v6.0.0

      - name: Set up Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c #v6.1.0
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 #v5.0.0
        with:
          node-version: 22.x

      - name: Set up Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 #v5.0.0
        with:
          distribution: 'temurin'
          java-version: 25

      # The platform, build tools and NDK versions are the ones
      # wallet/android/app/build.gradle and release/Dockerfile name.
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 #v3.2.2
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0 ndk;30.0.16248370'

      - name: Install web dependencies
        working-directory: wallet/appserver
        run: npm ci

      - name: Bind the Go core
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/30.0.16248370"
          wallet/android/bind.sh

      - name: Build debug APK
        working-directory: wallet/android
        run: ./gradlew :app:assembleNetSimnetDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 #v5.0.0
        with:
          name: debug-apk
          path: wallet/android/app/build/outputs/apk/netSimnet/debug/*.apk
