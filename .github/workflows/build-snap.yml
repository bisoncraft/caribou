name: Build and Publish Snap Package

on:
  # Manual only. Run it against a release tag once the XMR libraries for
  # that tag are published (wallet/asset/xmr/publish-libs.sh).
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (vX.Y.Z)"
        required: true
      publish:
        description: "Upload to the Snap Store stable channel"
        type: boolean
        default: false

jobs:
  build-snap:
    runs-on: ubuntu-latest

    steps:
      # The tag being built, not the ref the workflow was dispatched from:
      # fetch-libs.sh reads the XMR library pin from the checkout, and
      # package-linux.sh verifies the library against the SHA256SUMS at the
      # tag, so the two must come from the same revision.
      - name: Checkout code
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 #v6.0.0
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Fetch the pinned XMR library
        working-directory: wallet/asset/xmr
        run: ./fetch-libs.sh linux-amd64

      # release/package-linux.sh builds the caribou-builder image on first
      # use, then produces the .deb and a snapcraft.yaml that wraps it.
      - name: Build deb package
        run: release/package-linux.sh "${{ inputs.tag }}"

      - name: Locate build output
        id: out
        run: echo "dir=$(ls -d release/out/*/linux)" >> "$GITHUB_OUTPUT"

      - name: Build snap package
        uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1.3.0
        id: build
        with:
          path: ${{ steps.out.outputs.dir }}

      - name: Upload snap artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 #v5.0.0
        with:
          name: snap
          path: ${{ steps.build.outputs.snap }}

      - name: Publish snap to Snap Store
        if: ${{ inputs.publish }}
        uses: snapcore/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40 # v1.2.0
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: stable
