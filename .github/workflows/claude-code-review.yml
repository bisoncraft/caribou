name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write
  actions: read

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-code:
    name: Claude Code Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 #v6.0.0
        with:
          fetch-depth: 0

      - name: Run Claude Code
        uses: anthropics/claude-code-action@dde2242db6af13460b916652159b6ba19a598f30 #v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_tools: |
            - mcp__github_inline_comment__create_inline_comment
            - Bash(gh pr view:*)
            - Bash(gh pr diff:*)
            - Bash(gh pr comment:*)
          prompt: |
            Review pull request #${{ github.event.pull_request.number }}.
            Focus on:
            - bugs and logic errors
            - security issues (especially anything touching keys, signing, or RPC trust boundaries)
            - missing or weak test coverage on changed code paths
            - unclear or unidiomatic code

            Be concise. Skip nitpicks and don't restate what the diff already
            shows.

            When you're done, post a single summary comment on the PR with
            `gh pr comment ${{ github.event.pull_request.number }} --body "..."`.
            If there is nothing worth flagging, post a one-line "LGTM" comment
            so reviewers know the check ran. The built-in comment buffer is
            unreliable on this trigger path; always post via gh.
          # Configure via repository variables:
          # CLAUDE_CODE_MODEL: claude-haiku-4-5, claude-sonnet-4-6 (default), or claude-opus-4-7
          # CLAUDE_CODE_EFFORT: quick, standard (default), or thorough
          claude_args: |
            --model ${{ vars.CLAUDE_CODE_MODEL || 'claude-sonnet-4-6' }}
            --max-turns ${{ (vars.CLAUDE_CODE_EFFORT == 'quick' && '4') || (vars.CLAUDE_CODE_EFFORT == 'standard' && '8') || (vars.CLAUDE_CODE_EFFORT == 'thorough' && '12') || '8' }}
