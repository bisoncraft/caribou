name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write
  actions: read

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-code:
    name: Claude Code Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 #v6.0.0
        with:
          fetch-depth: 0

      - name: Run Claude Code
        uses: anthropics/claude-code-action@dde2242db6af13460b916652159b6ba19a598f30 #v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --model ${{ vars.CLAUDE_CODE_MODEL || 'claude-haiku-4-5' }}
            --max-turns ${{ (vars.CLAUDE_CODE_EFFORT == 'quick' && '4') || (vars.CLAUDE_CODE_EFFORT == 'standard' && '8') || (vars.CLAUDE_CODE_EFFORT == 'thorough' && '12') || '8' }}
        env:
          # Configure via repository variables:
          # CLAUDE_CODE_MODEL: claude-haiku-4-5 (default), claude-sonnet-4-6, or claude-opus-4-7
          # CLAUDE_CODE_EFFORT: quick, standard (default), or thorough
