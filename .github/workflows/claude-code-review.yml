name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write
  actions: read

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-code:
    name: Claude Code Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 #v6.0.0
        with:
          fetch-depth: 0

      - name: Run Claude Code
        uses: anthropics/claude-code-action@dde2242db6af13460b916652159b6ba19a598f30 #v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review pull request #${{ github.event.pull_request.number }}.
            Focus on:
            - bugs and logic errors
            - security issues (especially anything touching keys, signing, or RPC trust boundaries)
            - missing or weak test coverage on changed code paths
            - unclear or unidiomatic code

            Be concise. Skip nitpicks and don't restate what the diff already
            shows.

            Post the review as a single PR comment by running:
              gh pr comment ${{ github.event.pull_request.number }} --body "..."
            If there is nothing worth flagging, post a one-line "LGTM" so
            reviewers know the check ran. The action's built-in comment
            buffer drops clean-pass output (upstream issue), so always post
            via gh.
          # Configure via repository variables:
          # CLAUDE_CODE_MODEL: claude-haiku-4-5, claude-sonnet-4-6 (default), or claude-opus-4-7
          # CLAUDE_CODE_EFFORT: quick, standard (default), or thorough
          # --permission-mode bypassPermissions skips the per-tool allowlist
          # prompts. Safe here because the prompt is hardcoded in this file,
          # the workflow runs on the trusted CI runner (not user input), and
          # fork PRs do not get secrets under the pull_request trigger so
          # they cannot execute the Claude step at all. Without this, Claude
          # spends turns being denied on the action's own comment-posting
          # MCP tools and hits --max-turns before posting a review.
          claude_args: |
            --model ${{ vars.CLAUDE_CODE_MODEL || 'claude-sonnet-4-6' }}
            --max-turns ${{ (vars.CLAUDE_CODE_EFFORT == 'quick' && '8') || (vars.CLAUDE_CODE_EFFORT == 'standard' && '15') || (vars.CLAUDE_CODE_EFFORT == 'thorough' && '25') || '15' }}
            --permission-mode bypassPermissions
