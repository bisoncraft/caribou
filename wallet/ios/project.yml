name: Caribou
options:
  bundleIdPrefix: com.bisoncraft
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "15.0"

# One configuration per (network x debug/release), mirroring Android's product
# flavors x build types. The active network is selected by the xcconfig attached
# to the target for each config (see targets.Caribou.configFiles); the schemes
# below pick which config a Run/Archive uses. Build a specific network by
# selecting its scheme, the iOS analog of `gradle assembleNetSimnetDebug`.
configs:
  Debug-mainnet: debug
  Release-mainnet: release
  Debug-testnet: debug
  Release-testnet: release
  Debug-simnet: debug
  Release-simnet: release

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # iPhone + iPad.
    TARGETED_DEVICE_FAMILY: "1,2"
    # Automatic signing. The team id is NOT committed (it is developer-specific):
    # each network xcconfig optionally includes a git-ignored
    # Caribou/Config/Local.xcconfig that sets DEVELOPMENT_TEAM, so once you've
    # created that file, `xcodegen generate` + an -allowProvisioningUpdates build
    # provisions without picking a team in Xcode's GUI. Release builds are left
    # unshrunk while the app is pre-public (mirrors the Android shell).
    CODE_SIGN_STYLE: Automatic

targets:
  Caribou:
    type: application
    platform: iOS
    sources:
      - path: Caribou
        # Info.plist is referenced via INFOPLIST_FILE and the xcconfigs via
        # configFiles; keep them out of the compile/resource phases.
        excludes:
          - Info.plist
          - Config/*.xcconfig
    configFiles:
      Debug-mainnet: Caribou/Config/mainnet.xcconfig
      Release-mainnet: Caribou/Config/mainnet.xcconfig
      Debug-testnet: Caribou/Config/testnet.xcconfig
      Release-testnet: Caribou/Config/testnet.xcconfig
      Debug-simnet: Caribou/Config/simnet.xcconfig
      Release-simnet: Caribou/Config/simnet.xcconfig
    settings:
      base:
        INFOPLIST_FILE: Caribou/Info.plist
        # PRODUCT_BUNDLE_IDENTIFIER and the display name come from the
        # per-network xcconfig.
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    dependencies:
      # The gomobile-bound framework (build it with ./bind.sh). Embedded + signed
      # into the app bundle.
      - framework: Frameworks/Mobile.xcframework
        embed: true
        codeSign: true

  # Hermetic logic-test bundle for the pure session-lock policy. It compiles the
  # dependency-free LockTier.swift directly (rather than @testable-importing the
  # app) so the tier tests run without a host app, the gomobile Mobile.xcframework,
  # or a bind.sh step — the iOS analog of Android's JVM-side unit tests. Add a host
  # app + @testable import here if a test ever needs AppModel's UIKit/core surface.
  CaribouTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CaribouTests
      - path: Caribou/LockTier.swift
    settings:
      base:
        # Logic-test bundle with no committed Info.plist; let Xcode synthesize one.
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  Caribou (mainnet):
    build:
      targets:
        Caribou: all
        CaribouTests: [test]
    run:
      config: Debug-mainnet
    test:
      config: Debug-mainnet
      targets:
        - CaribouTests
    archive:
      config: Release-mainnet
  Caribou (testnet):
    build:
      targets:
        Caribou: all
    run:
      config: Debug-testnet
    archive:
      config: Release-testnet
  Caribou (simnet):
    build:
      targets:
        Caribou: all
    run:
      config: Debug-simnet
    archive:
      config: Release-simnet
