name: BossWallet
options:
  bundleIdPrefix: com.bisoncraft
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "15.0"

# One configuration per (network x debug/release), mirroring Android's product
# flavors x build types. The active network is selected by the xcconfig attached
# to the target for each config (see targets.BossWallet.configFiles); the schemes
# below pick which config a Run/Archive uses. Build a specific network by
# selecting its scheme, the iOS analog of `gradle assembleNetSimnetDebug`.
configs:
  Debug-mainnet: debug
  Release-mainnet: release
  Debug-testnet: debug
  Release-testnet: release
  Debug-simnet: debug
  Release-simnet: release

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # iPhone + iPad.
    TARGETED_DEVICE_FAMILY: "1,2"
    # Release builds are intentionally left without a signing identity while the
    # app is pre-public (mirrors the Android shell's unsigned release). Set
    # DEVELOPMENT_TEAM / a signing config before any distribution.
    CODE_SIGN_STYLE: Automatic

targets:
  BossWallet:
    type: application
    platform: iOS
    sources:
      - path: BossWallet
        # Info.plist is referenced via INFOPLIST_FILE and the xcconfigs via
        # configFiles; keep them out of the compile/resource phases.
        excludes:
          - Info.plist
          - Config/*.xcconfig
    configFiles:
      Debug-mainnet: BossWallet/Config/mainnet.xcconfig
      Release-mainnet: BossWallet/Config/mainnet.xcconfig
      Debug-testnet: BossWallet/Config/testnet.xcconfig
      Release-testnet: BossWallet/Config/testnet.xcconfig
      Debug-simnet: BossWallet/Config/simnet.xcconfig
      Release-simnet: BossWallet/Config/simnet.xcconfig
    settings:
      base:
        INFOPLIST_FILE: BossWallet/Info.plist
        # PRODUCT_BUNDLE_IDENTIFIER and the display name come from the
        # per-network xcconfig.
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    dependencies:
      # The gomobile-bound framework (build it with ./bind.sh). Embedded + signed
      # into the app bundle.
      - framework: Frameworks/Mobile.xcframework
        embed: true
        codeSign: true

schemes:
  BossWallet (mainnet):
    build:
      targets:
        BossWallet: all
    run:
      config: Debug-mainnet
    archive:
      config: Release-mainnet
  BossWallet (testnet):
    build:
      targets:
        BossWallet: all
    run:
      config: Debug-testnet
    archive:
      config: Release-testnet
  BossWallet (simnet):
    build:
      targets:
        BossWallet: all
    run:
      config: Debug-simnet
    archive:
      config: Release-simnet
