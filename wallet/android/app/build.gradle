plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.bisoncraft.caribou'
    compileSdk 34
    // build-tools 35+ zipaligns uncompressed native libs to 16 KB pages.
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'com.bisoncraft.caribou'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        // gomobile produces native .so per ABI inside the .aar; arm64 covers
        // modern devices. Add others as the bind targets grow.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildFeatures {
        buildConfig true
    }

    // One flavor per network. Each gets a distinct applicationId suffix and
    // launcher label so mainnet/testnet/simnet can be installed side by side,
    // and sets BuildConfig.WALLET_NET, which MainActivity passes to App.start.
    // Flavor names are "net"-prefixed because Gradle reserves names starting
    // with "test". Build a specific one, e.g.: gradle assembleNetSimnetDebug
    flavorDimensions 'network'
    productFlavors {
        netMainnet {
            dimension 'network'
            buildConfigField 'String', 'WALLET_NET', '"mainnet"'
            manifestPlaceholders = [appName: 'Caribou']
        }
        netTestnet {
            dimension 'network'
            applicationIdSuffix '.testnet'
            versionNameSuffix '-testnet'
            buildConfigField 'String', 'WALLET_NET', '"testnet"'
            manifestPlaceholders = [appName: 'Caribou testnet']
        }
        netSimnet {
            dimension 'network'
            applicationIdSuffix '.simnet'
            versionNameSuffix '-simnet'
            buildConfigField 'String', 'WALLET_NET', '"simnet"'
            manifestPlaceholders = [appName: 'Caribou simnet']
        }
    }

    buildTypes {
        release {
            // Release builds are intentionally left unsigned and unshrunk while
            // the app is pre-public. Add a signingConfig and enable minify
            // before any distribution.
            minifyEnabled false
        }
    }

    // Store .so uncompressed so it can be mmap'd directly and 16 KB-aligned in
    // the APK (required for Android 15+ 16 KB-page devices and Play API 35+).
    packaging {
        jniLibs {
            useLegacyPackaging false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // The gomobile-bound library (build it with ./bind.sh).
    implementation files('libs/mobile.aar')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // BiometricPrompt + CryptoObject for the keystore-backed biometric unlock.
    implementation 'androidx.biometric:biometric:1.1.0'

    // Instrumented tests (run on a device/emulator) for the keystore/cipher paths.
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:runner:1.5.2'
}
