plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.bisoncraft.bosswallet'
    compileSdk 34
    // build-tools 35+ zipaligns uncompressed native libs to 16 KB pages.
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'com.bisoncraft.bosswallet'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
        // gomobile produces native .so per ABI inside the .aar; arm64 covers
        // modern devices. Add others as the bind targets grow.
        ndk {
            abiFilters 'arm64-v8a'
        }
        // Network the wallet boots on: "mainnet" (default), "testnet", or
        // "simnet". Override at build time, e.g. for a simnet dev build:
        //   gradle assembleDebug -PwalletNet=simnet
        def walletNet = (project.findProperty('walletNet') ?: 'mainnet').toString()
        buildConfigField 'String', 'WALLET_NET', "\"${walletNet}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            // Release builds are intentionally left unsigned and unshrunk while
            // the app is pre-public. Add a signingConfig and enable minify
            // before any distribution.
            minifyEnabled false
        }
    }

    // Store .so uncompressed so it can be mmap'd directly and 16 KB-aligned in
    // the APK (required for Android 15+ 16 KB-page devices and Play API 35+).
    packaging {
        jniLibs {
            useLegacyPackaging false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // The gomobile-bound library (build it with ./bind.sh).
    implementation files('libs/mobile.aar')
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
