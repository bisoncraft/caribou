buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // The Android Gradle plugin compiles Kotlin itself (built-in Kotlin),
        // with the Kotlin Gradle plugin it finds on the build classpath. Naming
        // it here pins the Kotlin version instead of leaving it to the plugin's
        // default.
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.21'
    }
}

plugins {
    id 'com.android.application' version '9.5.3' apply false
}
