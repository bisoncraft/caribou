[Application Options]

; In addition to the config options listed below there is one more switch
; which could useful when provided with caribou via cli:

; `--version` or `-v` - Display version information and exit.

; ------------------------------------------------------------------------------
; Data settings
; ------------------------------------------------------------------------------

; Path to application directory. The default is ~/.caribou on UNIX OSes,
; ~/Library/Application Support/Caribou on macOS and %localappdata%\Caribou on
; Windows.
; appdata=~/.caribou

; Path to an INI configuration file. The default is ~/.caribou/caribou.conf.
; config=~/.caribou/caribou.conf

; Database filepath. Database will be created if it does not exist. The default
; dir is network specific:
; Mainnet:
; db=~/.caribou/mainnet/caribou.db
; Testnet:
; db=~/.caribou/testnet/caribou.db
; Simnet:
; db=~/.caribou/simnet/caribou.db

; Custom path for the 'site' directory containing static web files.
; Default/unset causes caribou to search a few common paths. The default will
; work for most use cases.
; sitedir=

; ------------------------------------------------------------------------------
; Network settings
; ------------------------------------------------------------------------------

; Use testnet.
; Default is false.
; testnet=true

; Use simnet.
; Default is false.
; simnet=true

; Connect via a SOCKS5 proxy.
; Connections are isolated, so Tor uses a new circuit for each one. Local and
; private node addresses are not proxied. zcashd RPC is unencrypted, so reach a
; remote zcashd at a .onion address; over a clear-net address the Tor exit node
; can read its credentials and traffic.
; torproxy=127.0.0.1:9050

; ------------------------------------------------------------------------------
; RPC server settings
; ------------------------------------------------------------------------------

; Turn on RPC server.
; Default is false.
; rpc=true

; RPC server listen address. The default value is network specific:
; Mainnet:
; rpcaddr=127.0.0.1:5757
; Testnet: 
; rpcaddr=127.0.0.2:5757
; Simnnet:
; rpcaddr=127.0.0.3:5757

; RPC server user name.
; rpcuser=

; RPC server password.
; rpcpass=

; RPC server certificate file location.
; rpccert=~/.caribou/rpc.cert

; RPC server key file location.
; rpckey=~/.caribou/rpc.key

; ------------------------------------------------------------------------------
; Web server settings
; ------------------------------------------------------------------------------

; HTTP server listen address. The default value is network specific:
; Mainnet:
; webaddr=127.0.0.1:5758
; Testnet: 
; webaddr=127.0.0.2:5758
; Simnnet:
; webaddr=127.0.0.3:5758

; Disable the web server. This can be true only if RPC server is on(rpc=true).
; Default is false.
; noweb=true

; Do not use the embedded webserver site resources, instead reading them from
; disk. Reload the webserver's page template with every request. For development
; purposes.
; Default is false.
; no-embed-site=true

; ------------------------------------------------------------------------------
; Debug settings
; ------------------------------------------------------------------------------

; Logging level {trace, debug, info, warn, error, critical}
; log=debug

; Use local time zone time stamps in log entries.
; Default is false - UTC time zone is used.
; loglocal=true

; File for CPU profiling. e.g. caribou.pprof. Disabled/empty by default.
; cpuprofile=

; Start HTTP profiler.
; Default is false.
; httpprof=true

; ------------------------------------------------------------------------------
; Trading settings
; ------------------------------------------------------------------------------

; Maximum number of active swap matches per DEX connection before deferring
; new orders. Default is 48.
; max-active-matches=48
